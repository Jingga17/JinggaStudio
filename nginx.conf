server {
    listen 80;
    server_name localhost;

    # Frontend static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API ke backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # Serve the generated data-analisis.js from the shared volume
    location = /js/data-analisis.js {
        alias /usr/share/nginx/html/js_shared/data-analisis.js;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Serve html, js, and css with revalidation to ensure instant updates
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache media static assets aggressively
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
